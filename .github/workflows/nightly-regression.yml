name: nightly-scripted-pipeline

on:
  schedule:
    - cron: "13 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run 90 scripted pipeline fixtures
        run: make evaluation-scripted

      - name: Collect version metrics
        run: |
          for version in v0.2-A v0.2-B v0.2-C; do
            python tools/scripts/collect_metrics.py \
              --run-dir "runs/nightly-scripted/$version" \
              --output "runs/nightly-scripted/metrics-$version.json"
          done

      - name: Compare versions with confidence intervals
        run: |
          python tools/scripts/compare_evaluations.py \
            --metrics runs/nightly-scripted/metrics-v0.2-A.json \
                      runs/nightly-scripted/metrics-v0.2-B.json \
                      runs/nightly-scripted/metrics-v0.2-C.json \
            --labels A,B,C \
            --output runs/nightly-scripted/statistics.json

      - name: Mark artifact boundary
        run: |
          echo "Scripted fixtures exercise the 90-run pipeline only."
          echo "They are not Gazebo or release evidence."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-scripted-pipeline
          path: runs/nightly-scripted
