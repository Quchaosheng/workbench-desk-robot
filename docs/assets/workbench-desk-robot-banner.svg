  <text x="140" y="230" fill="#f4f7f5" font-family="Arial, sans-serif" font-size="56" font-weight="700">Verify before you say done.</text>
  <text x="140" y="276" fill="#a8bac0" font-family="Arial, sans-serif" font-size="24">A tabletop robot runtime built around evidence, replay, and fail-closed decisions.</text>
