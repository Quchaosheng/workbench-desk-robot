  <text x="1250" y="264" fill="#f4f7f5" font-family="Arial, sans-serif" font-size="34" font-weight="700">Three states.</text>
  <text x="1250" y="306" fill="#a8bac0" font-family="Arial, sans-serif" font-size="18">No silent success.</text>
  <circle cx="1268" cy="378" r="10" fill="#8fe0cc"/><text x="1300" y="386" fill="#dce9e3" font-family="Arial, sans-serif" font-size="22">CONFIRMED</text>
