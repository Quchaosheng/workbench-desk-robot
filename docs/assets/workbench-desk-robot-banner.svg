<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Workbench Desk Robot</title>
  <desc id="desc">A tabletop robot visual with a verification-first event timeline and three-valued task status.</desc>
  <rect width="1600" height="900" fill="#11191d"/>
  <rect x="64" y="64" width="1472" height="772" rx="24" fill="#182328" stroke="#33464d" stroke-width="2"/>
