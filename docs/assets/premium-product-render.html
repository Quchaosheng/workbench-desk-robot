<body><div id="scene"></div><div class="copy"><div class="eyebrow">WORKBENCH HOME ROBOT · REV D</div><h1>双手接住，<br>家里的杂事。</h1><p>双七轴操作臂、可升降移动底盘、双手协作。<br>取件、清洁、锅边备餐，先从受控场景开始。</p></div><div class="scene-label"><b>CONCEPT · PHYSICAL VALIDATION REQUIRED</b><br>BIMANUAL MOBILE MANIPULATION</div>

function add(g,mat,p,r=[0,0,0],scale=[1,1,1]){const raw=p?.isVector3?[p.x,p.y,p.z]:p;const q=(Array.isArray(raw)?raw:[0,0,0]).map(v=>Number.isFinite(v)?v:0);const o=new THREE.Mesh(g,mat);o.position.set(...q);o.rotation.set(...r);o.scale.set(...scale);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}function box(w,h,d,r,mat,p,rot=[0,0,0]){const rr=Math.max(.008,Math.min(r,w/2-.006,h/2-.006,d/2-.006));return add(new RoundedBoxGeometry(w,h,d,8,rr),mat,p,rot)}function cyl(rad,len,mat,p,rot=[0,0,0]){const R=Number.isFinite(rad)?Math.max(.01,rad):.1;const L=Number.isFinite(len)?Math.max(.02,len):.1;return add(new THREE.CylinderGeometry(R,R,L,48),mat,p,rot)}

function buildArm(side){const sx=.65+side*1.35;const P={j1:[sx,4.54,.12],j2:[sx+side*.16,4.45,.24],j3:[sx+side*.34,4.34,.46],j4:[sx+side*.83,3.82,1.18],j5:[sx+side*.64,3.35,1.92],j6:[.65+side*.72,3.12,2.34],j7:[.65+side*.58,3.0,2.52],ee:[.65+side*.48,2.9,2.65]};joint(P.j1,.42,[0,0,0]);joint(P.j2,.37,[0,Math.PI/2,0]);joint(P.j3,.32,[Math.PI/2,0,0]);link(P.j3,P.j4,.31);joint(P.j4,.28,[0,Math.PI/2,0]);link(P.j4,P.j5,.25,metal);joint(P.j5,.22,[Math.PI/2,0,0]);link(P.j5,P.j6,.17,graphite);joint(P.j6,.18,[0,Math.PI/2,0]);link(P.j6,P.j7,.14,graphite);joint(P.j7,.15,[Math.PI/2,0,0]);link(P.j7,P.ee,.12,graphite);cyl(.13,.26,physical(0xc5c6bb,.28,.55),P.ee,[Math.PI/2,0,0]);box(.14,.5,.12,.04,elastomer,[P.ee[0],2.74,2.68+side*.18],[0,0,side*.18])}

scene.add(new THREE.HemisphereLight(0xfffcf6,0x52605b,2.2));const key=new THREE.DirectionalLight(0xfff9ed,4.4);key.position.set(-4,11,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);const rim=new THREE.DirectionalLight(0x9ccfc1,2.3);rim.position.set(8,6,-5);scene.add(rim);const warm=new THREE.PointLight(0xffd9bd,14,12);warm.position.set(-3,4,5);scene.add(warm);
