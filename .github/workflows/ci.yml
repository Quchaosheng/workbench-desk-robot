name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: make lint
      - run: make test
      - run: make contract
      - run: make scenario-check
      - run: make golden-check
      - run: make context-check
      - run: make demo-scripted
      - run: make demo-offline

  container-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t workbench-1:ci .
      - run: docker run --rm workbench-1:ci python tools/scripts/local_runner.py --goal "Place the red block in the tray"
