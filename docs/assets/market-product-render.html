<body><div id="scene"></div><div class="copy"><div class="eyebrow">WORKBENCH HOME ROBOT · REV D</div><h1>家里的小事，<br>我来搭把手。</h1><p>会移动、会取放，也会先确认再行动。<br>双臂协作取件、清洁与锅边备餐。</p><span class="warm-note"><i></i>懂分寸，也懂照顾</span></div><div class="scene-label"><b>CONCEPT · PHYSICAL VALIDATION REQUIRED</b><br>HOLONOMIC BIMANUAL MANIPULATION</div><div class="status-strip"><div class="status-item"><span class="dot"></span>双臂协作</div><div class="status-item peach"><span class="dot"></span>四轮灵活移动</div><div class="status-item ivory"><span class="dot"></span>先验证，再行动</div><div class="revision">REVISION D&nbsp; / &nbsp;CONCEPT</div></div>

const physical=(c,r=.4,m=0)=>new THREE.MeshPhysicalMaterial({color:c,roughness:r,metalness:m,clearcoat:.18,clearcoatRoughness:.3});const shell=physical(0xfaf6ee,.25,.03),metal=physical(0x697570,.32,.52),graphite=physical(0x34423d,.42,.28),elastomer=physical(0x25312d,.75,.05),jade=physical(0x75c9b4,.25,.12),peach=physical(0xf2a77f,.34,.08),glass=physical(0x07100f,.1,.25);const textile=new THREE.MeshStandardMaterial({color:0x4a514c,roughness:.98});
function add(g,mat,p,r=[0,0,0],scale=[1,1,1]){const raw=p?.isVector3?[p.x,p.y,p.z]:p;const q=(Array.isArray(raw)?raw:[0,0,0]).map(v=>Number.isFinite(v)?v:0);const o=new THREE.Mesh(g,mat);o.position.set(...q);o.rotation.set(...r);o.scale.set(...scale);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}function box(w,h,d,r,mat,p,rot=[0,0,0]){const rr=Math.max(.008,Math.min(r,w/2-.006,h/2-.006,d/2-.006));return add(new RoundedBoxGeometry(w,h,d,8,rr),mat,p,rot)}function cyl(rad,len,mat,p,rot=[0,0,0]){const R=Number.isFinite(rad)?Math.max(.01,rad):.1;const L=Number.isFinite(len)?Math.max(.02,len):.1;return add(new THREE.CylinderGeometry(R,R,L,48),mat,p,rot)}function wheel(rad,len,mat,p,steer=0){const axis=new THREE.Vector3(Math.cos(steer),0,Math.sin(steer));const o=add(new THREE.CylinderGeometry(rad,rad,len,56),mat,p);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),axis);return o}
// Scale is intentionally architectural: the visible layers are base, lift, torso, shoulder and head.
box(3.72,.48,3.14,.38,graphite,[.65,.62,0]);box(3.58,.15,2.98,.15,metal,[.65,.93,0]);box(3.86,.16,3.24,.16,elastomer,[.65,.47,0]);

function jointCartridge(p,r,rot=[Math.PI/2,0,0]){cyl(r*.76,r*.82,graphite,p,rot);cyl(r*.88,.07,metal,p,rot);cyl(r*.24,.09,jade,p,rot)}function link(a,b,r,matl=metal){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),v=B.clone().sub(A),mid=A.clone().add(B).multiplyScalar(.5);const o=add(new THREE.CylinderGeometry(r*.86,r*1.08,v.length(),36),matl,mid);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());return o}function fairedLink(a,b,w,d,matl=shell,r=.18,gap=.16){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),axis=B.clone().sub(A),unit=axis.clone().normalize(),g=Math.min(gap,axis.length()*.22),S=A.clone().addScaledVector(unit,g),E=B.clone().addScaledVector(unit,-g),v=E.clone().sub(S),mid=S.clone().add(E).multiplyScalar(.5),rr=Math.min(r,w*.34,d*.34);const o=add(new RoundedBoxGeometry(w,v.length(),d,8,rr),matl,mid);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());return o}
function buildArm(side){const sx=.65+side*1.08;const P={j1:[sx,4.22,.12],j2:[sx+side*.14,4.16,.24],j3:[sx+side*.28,4.08,.46],j4:[sx+side*.67,3.68,1.16],j5:[sx+side*.53,3.28,1.88],j6:[.65+side*.63,3.08,2.30],j7:[.65+side*.52,2.98,2.48],ee:[.65+side*.44,2.90,2.61]};fairedLink(P.j1,P.j3,.44,.40,shell,.15,.10);fairedLink(P.j3,P.j4,.48,.42,shell,.16,.14);fairedLink(P.j4,P.j5,.44,.40,shell,.15,.13);fairedLink(P.j5,P.j6,.34,.31,shell,.11,.10);fairedLink(P.j6,P.j7,.25,.23,graphite,.08,.07);fairedLink(P.j7,P.ee,.20,.19,metal,.07,.05);jointCartridge(P.j1,.28,[0,0,0]);jointCartridge(P.j3,.22,[0,0,Math.PI/2]);jointCartridge(P.j4,.21,[Math.PI/2,0,0]);jointCartridge(P.j5,.17,[0,0,Math.PI/2]);jointCartridge(P.j6,.14,[Math.PI/2,0,0]);jointCartridge(P.j7,.11,[0,0,Math.PI/2]);cyl(.10,.20,physical(0xc5c6bb,.28,.55),P.ee,[Math.PI/2,0,0]);box(.11,.40,.09,.04,elastomer,[P.ee[0],2.74,2.64+side*.16],[0,0,side*.18])}

box(1.12,.78,.76,.28,metal,[.65,5.38,0]);box(1.62,.15,.64,.08,graphite,[.65,5.72,0]);box(1.40,.14,.54,.06,metal,[.65,5.80,0]);box(2.80,1.34,1.10,.50,shell,[.65,6.42,0],[-.05,0,.015]);box(2.48,.92,.44,.24,glass,[.65,6.40,.34],[-.05,0,.015]);for(const x of[.29,1.01]){const eye=cyl(.085,.025,jade,[x,6.46,.575],[Math.PI/2,0,0]);eye.scale.set(1,.72,1)}for(const x of[.18,1.12])cyl(.085,.026,peach,[x,6.27,.576],[Math.PI/2,0,0]);box(.25,.035,.028,.018,jade,[.65,6.22,.58],[-.05,0,0]);box(.10,.035,.028,.018,jade,[.48,6.24,.58],[-.05,0,-.25]);box(.10,.035,.028,.018,jade,[.82,6.24,.58],[-.05,0,.25]);

scene.add(new THREE.HemisphereLight(0xfffcf6,0x52605b,2.2));const key=new THREE.DirectionalLight(0xfff9ed,4.4);key.position.set(-4,11,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);const rim=new THREE.DirectionalLight(0x9ccfc1,2.3);rim.position.set(8,6,-5);scene.add(rim);const warm=new THREE.PointLight(0xffd9bd,14,12);warm.position.set(-3,4,5);scene.add(warm);
