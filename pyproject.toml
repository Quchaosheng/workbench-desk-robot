[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-1"
version = "0.1.0"
description = "Evidence-first embodied-agent simulator foundation"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "pytest-benchmark>=4,<5",
  "ruff>=0.6,<0.7",
  "pre-commit>=3,<4",
]

[tool.setuptools.packages.find]
where = [
  "libs/contracts",
  "services/agent_runtime",
  "services/backend",
  "services/world_model",
  "firmware/virtual_mcu",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
]
markers = [
  "integration: marks tests as integration tests (跨模块)",
  "regression: marks tests as regression tests (12 场景)",
  "benchmark: marks tests as performance benchmarks",
]

[tool.coverage.run]
source = ["services", "libs", "firmware"]
omit = ["*/tests/*", "*/__pycache__/*", "*/build/*"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["build"]

# Rules are deliberately a small, high-signal set. The point is to catch real
# defects (undefined names, unused imports, mutable default arguments), not to
# enforce taste. Widen this only when the team agrees the added rule is worth the
# churn it causes.
[tool.ruff.lint]
select = [
  "F",    # pyflakes: undefined names, unused imports, f-string mistakes
  "E",    # pycodestyle errors
  "I",    # import ordering
  "B",    # bugbear: mutable defaults, shadowed loop vars, assert-false
  "UP",   # pyupgrade: no 3.8 idioms in a 3.12 project
  "RUF",  # ruff's own correctness rules
]
ignore = [
  # These scripts must add the local package paths to sys.path before they can
  # import the packages under test, so the import cannot come first. The pattern
  # is intentional and is the documented way to run the tools without installing.
  "E402",
]

[tool.ruff.lint.per-file-ignores]
# Tests repeat setup deliberately and use literal fixtures.
"tests/**" = ["B011"]

# Format is checked in CI. Run `make fmt` to auto-fix locally.
[tool.ruff.format]
quote-style = "double"
