controller_manager:
  ros__parameters:
    update_rate: 500
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      # Provided by gripper_controllers; the plugin keeps its historical namespace.
      type: position_controllers/GripperActionController

arm_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
      shoulder_pan_joint: {goal: 0.02}
      shoulder_lift_joint: {goal: 0.02}
      elbow_joint: {goal: 0.02}
      wrist_1_joint: {goal: 0.02}
      wrist_2_joint: {goal: 0.02}
      wrist_3_joint: {goal: 0.02}

gripper_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint
