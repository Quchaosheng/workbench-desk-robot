site_name: Workbench Desk Robot
site_description: Controlled engineering and operator documentation
docs_dir: docs
strict: true
theme:
  name: mkdocs
nav:
  - User manual: user-guide/index.md
  - Installation: user-guide/installation.md
  - Daily operation: user-guide/operation.md
  - Maintenance: user-guide/maintenance.md
  - Troubleshooting: user-guide/troubleshooting.md
  - 90-minute demo: user-guide/demo-runbook.md
  - Project status: project-management/status.md
  - Project plan: project-management/plan.md
  - Risk management: project-management/risk-management.md
  - Dashboard design: design/dashboard-design-system.md
  - Dashboard usability test: design/dashboard-usability-test.md
  - Security program: security/README.md
  - Secure review: security/secure-review-standard.md
  - Incident response: security/incident-response.md
  - System architecture: architecture/system.md
  - Hardware:
      - Overview: hardware/README.md
      - Wiring: hardware/wiring.md
      - Bring-up and debugging: hardware/bringup.md
  - API reference: api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - libs/kernel
