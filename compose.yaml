services:
  dashboard:
    build:
      context: .
    image: workbench-1:local
    environment:
      WORKBENCH_OFFLINE: "1"
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - public
      - model-runtime

  model:
    profiles: ["model"]
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - model-cache:/root/.ollama
    expose:
      - "11434"
    networks:
      - model-runtime
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6

  model-bootstrap:
    profiles: ["model-bootstrap"]
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"
      WORKBENCH_MODEL: "${WORKBENCH_MODEL:-qwen2.5:0.5b}"
    volumes:
      - model-cache:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve >/tmp/ollama-bootstrap.log 2>&1 & server_pid=$$!; trap 'kill $$server_pid' EXIT; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull \"${WORKBENCH_MODEL:-qwen2.5:0.5b}\""]
    networks:
      - bootstrap

networks:
  public:
  model-runtime:
    internal: true
  bootstrap:

volumes:
  model-cache:
