name: release-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  verify-build-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          make check

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          load: true
          tags: workbench-1:release-candidate
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=release-runtime
          cache-to: type=gha,mode=max,scope=release-runtime

      - name: Smoke-test image
        run: docker run --rm workbench-1:release-candidate python tools/scripts/local_runner.py --goal "Place the red block in the tray"

      - uses: anchore/sbom-action@v0
        with:
          image: workbench-1:release-candidate
          format: spdx-json
          output-file: workbench-1.spdx.json

      - name: Publish tested image
        id: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker tag workbench-1:release-candidate "$tag"
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"
          first_tag="$(printf '%s\n' "$IMAGE_TAGS" | sed -n '/./{p;q;}')"
          digest="$(docker image inspect "$first_tag" --format '{{index .RepoDigests 0}}' | awk -F@ '{print $2}')"
          if [ -z "$digest" ]; then
            echo "Published image has no registry digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: workbench-1-sbom
          path: workbench-1.spdx.json

      - name: Write release provenance manifest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          python tools/scripts/release_manifest.py \
            --image workbench-1:release-candidate \
            --sbom workbench-1.spdx.json \
            --version "$RELEASE_VERSION" \
            --registry-image "$REGISTRY_IMAGE" \
            --output release-manifest.json

      - name: Attest published image
        if: steps.publish.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@v4
        with:
          name: workbench-1-release-provenance
          path: release-manifest.json
