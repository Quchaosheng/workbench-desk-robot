name: nightly-regression

on:
  schedule:
    # 每天 UTC 18:00 (北京时间凌晨 02:00)
    - cron: '13 18 * * *'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run 12 frozen scenarios
        run: |
          # TODO: 一旦 Gazebo 层就位,取消注释这行
          # python tests/regression/run_frozen_scenarios.py --version main
          echo "⚠️  Gazebo 层尚未就位,跳过回归测试"
          echo "    当前只跑 demo-scripted 作为占位"
          make demo-scripted

      - name: Report results
        if: always()
        run: |
          echo "TODO: 夜间回归结果通知到协作频道"
