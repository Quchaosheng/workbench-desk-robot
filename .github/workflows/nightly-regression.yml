name: nightly-regression-placeholder

on:
  schedule:
    - cron: '13 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# NOTE: This workflow is a PLACEHOLDER.
# It runs demo-scripted as a smoke test until the Gazebo layer lands.
# A green result here does NOT mean the 12 frozen scenarios passed.
# Once real Gazebo integration exists, enable the commented block below.

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Smoke test (placeholder until Gazebo layer lands)
        run: |
          echo "⚠️  PLACEHOLDER: running demo-scripted, not the 12 frozen scenarios"
          echo "    Enable the real regression once Gazebo integration is complete."
          make demo-scripted

      # TODO: uncomment when Gazebo is available on the runner
      # - name: Run 12 frozen scenarios
      #   run: python tests/regression/run_frozen_scenarios.py --version main
