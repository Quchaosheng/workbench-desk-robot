name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: make lint
      - run: make test
      - run: make contract
      - run: make scenario-check
      - run: make golden-check
      - run: make context-check
      - run: python tools/scripts/check_task_packet.py --all
      - run: make docs
      - run: make demo-scripted
      - run: make demo-offline

  container-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          tags: workbench-1:ci
          cache-from: type=gha,scope=ci-runtime
          cache-to: type=gha,mode=max,scope=ci-runtime
      - run: docker run --rm workbench-1:ci python tools/scripts/local_runner.py --goal "Place the red block in the tray"

  kernel-module:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install kernel headers and can-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "linux-headers-$(uname -r)" can-utils build-essential
      - name: Build and check wbcan.ko
        run: |
          make -C kernel/wbcan
          make -C kernel/wbcan checkpatch
      - name: Load the module and bring the interface up
        id: load-module
        continue-on-error: true
        run: |
          sudo modprobe can can-raw can-dev
          sudo insmod kernel/wbcan/wbcan.ko
          sudo ip link set wbcan0 type can restart-ms 100
          sudo ip link set wbcan0 up
          ip -details link show wbcan0

      - name: Run the fault suite
        if: steps.load-module.outcome == 'success'
        run: sudo ./kernel/wbcan/test_wbcan.sh wbcan0

      - name: Report unavailable kernel runtime
        if: steps.load-module.outcome == 'failure'
        run: echo "::warning title=Kernel runtime unavailable::The hosted runner built wbcan.ko but cannot load it; run the fault suite on a privileged Linux host."
      - name: Dump kernel log on failure
        if: failure()
        run: sudo dmesg | tail -50
      - name: Unload
        if: always()
        run: |
          sudo ip link set wbcan0 down 2>/dev/null || true
          sudo rmmod wbcan 2>/dev/null || true

  mcu-qemu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-unknown-elf qemu-system-misc
      - name: Build and run MCU checks
        run: |
          make -C firmware/mcu host
          make -C firmware/mcu test-host
          make -C firmware/mcu qemu
          make -C firmware/mcu verify-no-fp
          make -C firmware/mcu size-check
          make -C firmware/mcu test-qemu
