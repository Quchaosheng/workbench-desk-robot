name: release-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-build-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          make check

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=release-runtime
          cache-to: type=gha,mode=max,scope=release-runtime

      - name: Smoke-test image
        run: |
          image="$(echo '${{ steps.metadata.outputs.tags }}' | head -n 1)"
          docker run --rm "$image" python tools/scripts/local_runner.py --goal "Place the red block in the tray"

      - uses: anchore/sbom-action@v0
        with:
          image: ${{ fromJSON(steps.metadata.outputs.json).tags[0] }}
          format: spdx-json
          output-file: workbench-1.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: workbench-1-sbom
          path: workbench-1.spdx.json
